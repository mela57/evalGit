<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Evaluation</title>
</head>
<body>

    <div class="container">
        <div id="calculatrice">
            <div id="resultat">
                <input type="text" id="res" value ="">
            </div>
            <div id="ecran">
                <input type="text" id="nb1" value="">
                <input type="text" id="operateur" value="">
                <input type="text" id="nb2" value="">
            </div>
            
            <div id="operateurs">
                <input type="button" value="+" id="plus">
                <input type="button" value="-" id="moins">
                <input type="button" value="x" id="mult">
                <input type="button" value="/" id="div">
                <input type="button" value="=" id="egal">
                <input type="button" value="c" id="c">
            </div>
            <hr>
            <div id="chiffres">
                <input type="button" value="1" id="1">
                <input type="button" value="2" id="2">
                <input type="button" value="3" id="3">
                <input type="button" value="4" id="4">
                <input type="button" value="5" id="5">
                <input type="button" value="6" id="6">
                <input type="button" value="7" id="7">
                <input type="button" value="8" id="8">
                <input type="button" value="9" id="9">
                <input type="button" value="0" id="0">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
